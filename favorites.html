</head>


<body>


<header class="main-header">


<img 
src="images/logo.png"
class="logo"
alt="KAYLA MODE"
onerror="this.style.display='none'"
>


<h1>
❤️ KAYLA MODE
</h1>


<p>
Pwodwi mwen renmen
</p>


</header>





<nav class="menu">


<a href="index.html">

</a>


<a href="boutik.html">

</a>

</nav>






<section class="products">


<h2>
❤️ Favori mwen yo
</h2>



<div id="favoriteList">

</div>



</section>







<footer>


<p>

© 2026 KAYLA MODE - Tout dwa rezève

</p>


</footer>







<script>


function jwennFavori(){


return JSON.parse(

localStorage.getItem("favori")

) || [];


}






function soveFavori(data){


localStorage.setItem(

"favori",

JSON.stringify(data)

);


}







function afficherFavori(){


let favori=jwennFavori();


let box=document.getElementById(

"favoriteList"

);



box.innerHTML="";






if(favori.length===0){


box.innerHTML=

"<p>❤️ Ou poko gen pwodwi favori.</p>";


return;


}






favori.forEach(function(item,index){



box.innerHTML += `


<div class="product">



<img src="${item.image}">



<h3>

${item.nom}

</h3>



<p>

📂 ${item.categorie || "Kategori"}

</p>



<p class="new-price">

${item.prix}

</p>





<button onclick="retireFavori(${index})">

❌ Retire

</button>





<button onclick="achteFavori(${index})">

🛒 Achte

</button>



</div>



`;



});



}








function retireFavori(index){


let favori=jwennFavori();



favori.splice(index,1);



soveFavori(favori);



afficherFavori();



}








function achteFavori(index){


let produit=jwennFavori()[index];



let mesaj=`

🛍️ KAYLA MODE - KÒMAND

👗 Pwodwi: ${produit.nom}

💰 Pri: ${produit.prix}

`;


window.open(

"https://wa.me/50955545291?text="+

encodeURIComponent(mesaj),

"_blank"

);


}






afficherFavori();



</script>



</body>

</html>
