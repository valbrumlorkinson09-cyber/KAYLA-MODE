<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE Admin</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div id="loginBox">

<h2>🔐 KAYLA MODE ADMIN</h2>

<input type="password" id="adminPassword" placeholder="Antre modpas la">

<button class="buy" onclick="loginAdmin()">
Antre
</button>

</div>





<div id="adminPanel" style="display:none;">


<header>

<h1>🔐 KAYLA MODE ADMIN</h1>

<p>Jere pwodwi ak kòmann yo</p>


<button class="buy" onclick="logoutAdmin()">
🚪 Dekonekte
</button>


</header>






<section class="dashboard">


<div class="stat">

<h3>📦 Total pwodwi</h3>

<p id="totalProduits">0</p>

</div>



<div class="stat">

<h3>🛒 Total kòmann</h3>

<p id="totalKommann">0</p>

</div>




<div class="stat">

<h3>💰 Total lavant</h3>

<p id="totalVant">0 Gdes</p>

</div>




<div class="stat">

<h3>👥 Kliyan</h3>

<p id="totalKliyan">0</p>

</div>



</section>







<section class="admin-box">


<h2>📸 Ajoute / Modifye pwodwi</h2>



<label for="photoProduit" class="btn-photo">

📸 Chwazi foto

</label>



<input type="file" id="photoProduit" accept="image/*" hidden>



<img id="previewPhoto" width="200" style="margin-top:15px;border-radius:10px;">





<input type="text" id="nomProduit" placeholder="Non pwodwi">



<input type="number" id="prixProduit" placeholder="Nouvo pri">



<input type="number" id="ancienPrix" placeholder="Ansyen pri">





<select id="categorieProduit">

<option value="Fanm">👗 Fanm</option>

<option value="Gason">👔 Gason</option>

<option value="Soulye">👟 Soulye</option>

<option value="Sak">👜 Sak</option>

</select>






<select id="tagProduit">

<option value="Nouvo">🆕 Nouvo</option>

<option value="Promo">🔥 Promo</option>

</select>






<button class="buy" onclick="ajouterProduit()">

➕ Sove pwodwi

</button>



</section>








<section class="search-admin">


<h2>🔍 Chèche pwodwi</h2>


<input type="text" id="searchAdmin" placeholder="Chèche...">



<button onclick="rechercherProduit()">

🔍 Chèche

</button>


</section>







<section id="listeProduits">

<h2>🛍️ Pwodwi yo</h2>

</section>
<section class="admin-box">

<h2>📦 Kòmann kliyan yo</h2>

<div id="listeKommann">

</div>


</section>






<section id="listeKomann">


<h2>📦 Kòmann kliyan yo</h2>


</section>






</div>





<script src="admin.js"></script>


</body>

</html>
