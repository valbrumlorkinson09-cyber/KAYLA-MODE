<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE - Detay pwodwi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>👗 KAYLA MODE</h1>

<p>Detay pwodwi</p>

</header>





<section id="productDetail" class="products">

</section>





<footer>

<p>
© 2026 KAYLA MODE - Tout dwa rezève
</p>

</footer>





<script>


let produit = JSON.parse(

localStorage.getItem("produitChoisi")

);



const detail = document.getElementById("productDetail");





// ===============================
// KOMANTE SYSTEM
// ===============================


function jwennKomante(){


    return JSON.parse(

    localStorage.getItem(
    "komante_"+produit.nom
    )

    ) || [];


}






function soveKomante(data){


    localStorage.setItem(

    "komante_"+produit.nom,

    JSON.stringify(data)

    );


}







function voyeKomante(){



    let non = document.getElementById("nonClient").value;


    let mesaj = document.getElementById("mesajClient").value;


    let star = document.getElementById("starClient").value;





    if(non==="" || mesaj===""){


        alert("Ranpli tout enfòmasyon yo ❌");


        return;

    }





    let komante = jwennKomante();




    komante.push({


        non:non,

        mesaj:mesaj,

        star:star


    });





    soveKomante(komante);




    alert("Mèsi pou opinyon ou ❤️");



    location.reload();



}






if(produit){



detail.innerHTML = `


<div class="product">


<span class="tag">

${produit.tag || "Nouvo"}

</span>




<img src="${produit.image}">





<h2>

${produit.nom}

</h2>





<p>

📂 ${produit.categorie || "Kategori"}

</p>





<p class="new-price">

${produit.prix}

</p>





<h3>

⭐ Evalye pwodwi sa

</h3>





<select id="starClient">


<option value="⭐⭐⭐⭐⭐">
⭐⭐⭐⭐⭐
</option>


<option value="⭐⭐⭐⭐">
⭐⭐⭐⭐
</option>


<option value="⭐⭐⭐">
⭐⭐⭐
</option>


<option value="⭐⭐">
⭐⭐
</option>


<option value="⭐">
⭐
</option>



</select>





<h3>

💬 Kite yon kòmantè

</h3>





<input 
id="nonClient"
placeholder="Non ou">





<textarea 
id="mesajClient"
placeholder="Ekri opinyon ou">
</textarea>





<button class="buy" onclick="voyeKomante()">

📩 Voye kòmantè

</button>





<div id="listeKomante">

</div>



</div>


`;



}else{


detail.innerHTML = `

<h2>
Pa gen pwodwi chwazi
</h2>

`;



}
 // ===============================
// AFFICHAGE KOMANTE
// ===============================


function afficherKomante(){


    let box = document.getElementById("listeKomante");



    if(!box){

        return;

    }





    let komante = jwennKomante();




    if(komante.length === 0){


        box.innerHTML = `

        <h3>
        💬 Pa gen kòmantè ankò
        </h3>

        `;


        return;

    }







    box.innerHTML = `

    <h3>
    💬 Kòmantè kliyan yo
    </h3>

    `;






    komante.forEach(function(item){



        box.innerHTML += `


        <div class="comment-box">


        <h4>

        👤 ${item.non}

        </h4>



        <p>

        ${item.star}

        </p>



        <p>

        ${item.mesaj}

        </p>



        </div>



        `;



    });



}








// ===============================
// KALKIL MOYÈN NÒT
// ===============================


function mwayenStar(){


    let komante = jwennKomante();



    if(komante.length === 0){

        return "Pa gen nòt ankò";

    }





    let total = 0;




    komante.forEach(function(item){



        total += item.star.length;



    });





    let rezilta = Math.round(

    total / komante.length

    );





    let zetwal = "";





    for(let i=0;i<rezilta;i++){


        zetwal += "⭐";


    }





    return zetwal;



}








// ===============================
// AJOUTE INFO NÒT SOU PWODWI
// ===============================


function afficherNote(){


    let product = document.querySelector(".product");



    if(!product){

        return;

    }





    let info = document.createElement("p");



    info.innerHTML = `

    ⭐ Nòt kliyan:

    ${mwayenStar()}

    `;



    product.insertBefore(

    info,

    product.children[3]

    );



}







afficherKomante();

afficherNote();
 
// ===============================
// PROTEKSYON CHAJMAN PAJ
// ===============================


window.addEventListener(

"load",

function(){


    afficherKomante();


    afficherNote();


});
