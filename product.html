<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE - Pwodwi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>👗 KAYLA MODE</h1>

<p>Detay pwodwi</p>

</header>





<section id="productDetail" class="products">


</section>





<footer>

<p>
© 2026 KAYLA MODE - Tout dwa rezève
</p>

</footer>





<script>


let produit = JSON.parse(localStorage.getItem("produitChoisi"));



const detail = document.getElementById("productDetail");





function voyeKommann(){


    let non = document.getElementById("nonClient").value;

    let phone = document.getElementById("phoneClient").value;

    let kantite = document.getElementById("kantite").value;



    if(non === "" || phone === "" || kantite === ""){


        alert("Ranpli tout enfòmasyon yo ❌");

        return;

    }





    let message = `

🛍️ *KAYLA MODE - NOUVO KOMMANN*

👗 Pwodwi: ${produit.nom}

💰 Pri: ${produit.prix}

📦 Kantite: ${kantite}

👤 Non kliyan: ${non}

📞 Telefòn: ${phone}

`;




    let url = "https://wa.me/50955545291?text=" + encodeURIComponent(message);



    window.open(url,"_blank");


}







if(produit){


detail.innerHTML = `



<div class="product">


<span class="tag">

${produit.tag || "Nouvo"}

</span>




<img src="${produit.image}">





<h2>

${produit.nom}

</h2>





<p>

📂 ${produit.categorie || "Kategori"}

</p>





${
produit.ancienPrix 
? `<p class="old-price">${produit.ancienPrix}</p>`
: ""
}






<p class="new-price">

${produit.prix}

</p>






<h3>

📝 Fè kòmann

</h3>





<input id="nonClient" placeholder="Non ou">



<input id="phoneClient" placeholder="Nimewo WhatsApp ou">



<input id="kantite" type="number" placeholder="Kantite">






<button class="buy" onclick="voyeKommann()">

🛒 Voye kòmann

</button>




</div>



`;



}else{


detail.innerHTML = `

<h2>
Pa gen pwodwi chwazi
</h2>

`;



}


</script>


</body>

</html>
