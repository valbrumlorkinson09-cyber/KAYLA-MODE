<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE - Detay pwodwi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>👗 KAYLA MODE</h1>

<p>Detay pwodwi</p>

</header>



<section id="productDetail" class="products">

</section>



<footer>

<p>
© 2026 KAYLA MODE - Tout dwa rezève
</p>

</footer>




<script>


// ===============================
// CHARGE PWODWI
// ===============================


let produit = JSON.parse(

localStorage.getItem("produitChoisi")

);



const detail = document.getElementById("productDetail");






// ===============================
// KOMANTE + RATING SYSTEM
// ===============================


function kleKomante(){


    if(!produit){

        return "";

    }


    return "avis_" + produit.nom;


}





function jwennAvis(){


    let kle = kleKomante();


    if(kle===""){

        return [];

    }


    return JSON.parse(

        localStorage.getItem(kle)

    ) || [];


}






function soveAvis(avis){


    let kle = kleKomante();


    localStorage.setItem(

        kle,

        JSON.stringify(avis)

    );


}






function zetwal(n){


    let rezilta="";


    for(let i=0;i<n;i++){

        rezilta += "⭐";

    }


    return rezilta;


}






// ===============================
// VOYE AVIS
// ===============================


function voyeAvis(){


    let non = document.getElementById("nonClient").value;


    let mesaj = document.getElementById("mesajClient").value;


    let note = document.getElementById("noteClient").value;





    if(non==="" || mesaj===""){


        alert("Ranpli enfòmasyon yo ❌");


        return;

    }




    let avis = jwennAvis();





    avis.push({


        non:non,


        mesaj:mesaj,


        note:Number(note)



    });





    soveAvis(avis);





    alert("Mèsi pou kòmantè ou ❤️");



    location.reload();


}






// ===============================
// AFFICHE PWODWI
// ===============================


if(produit){


detail.innerHTML = `


<div class="product">



<span class="tag">

${produit.tag || "Nouvo"}

</span>





<img src="${produit.image}">





<h2>

${produit.nom}

</h2>





<p>

📂 ${produit.categorie || "Kategori"}

</p>





<p class="new-price">

${produit.prix}

</p>




<h3>

⭐ Bay pwodwi a yon nòt

</h3>



<select id="noteClient">


<option value="5">
⭐⭐⭐⭐⭐
</option>


<option value="4">
⭐⭐⭐⭐
</option>


<option value="3">
⭐⭐⭐
</option>


<option value="2">
⭐⭐
</option>


<option value="1">
⭐
</option>


</select>





<h3>

💬 Kòmantè ou

</h3>




<input id="nonClient" placeholder="Non ou">



<textarea id="mesajClient" placeholder="Ekri kòmantè ou"></textarea>




<button class="buy" onclick="voyeAvis()">

📩 Voye

</button>





<div id="listeAvis">

</div>



</div>


`;



}else{


detail.innerHTML = `

<h2>
Pa gen pwodwi chwazi
</h2>

`;



}
// ===============================
// AFFICHE KOMANTÈ + RATING
// ===============================


function mwayenNòt(){


    let avis = jwennAvis();



    if(avis.length === 0){


        return 0;

    }





    let total = 0;



    avis.forEach(function(item){


        total += item.note;


    });





    return Math.round(total / avis.length);


}







function afficherNòt(){


    let box = document.getElementById("listeAvis");



    if(!box){

        return;

    }





    let avis = jwennAvis();



    let moy = mwayenNòt();





    let html = `



    <h3>

    ⭐ Evalyasyon kliyan

    </h3>



    <p>

    Nòt mwayèn:

    ${moy > 0 ? zetwal(moy) : "Pa gen nòt ankò"}

    </p>



    <p>

    👥 ${avis.length} kliyan bay opinyon

    </p>



    `;







    if(avis.length === 0){



        html += `

        <p>
        💬 Pa gen kòmantè ankò
        </p>

        `;



    }





    avis.forEach(function(item){



        html += `



        <div class="comment-box">



        <h4>

        👤 ${item.non}

        </h4>




        <p>

        ${zetwal(item.note)}

        </p>





        <p>

        ${item.mesaj}

        </p>




        </div>



        `;



    });






    box.innerHTML = html;



}






// ===============================
// CHAJ KOMANTÈ YO
// ===============================


afficherNòt();
   // ===============================
// RAFRECHI Apre CHAJMAN
// ===============================


window.addEventListener("load", function(){


    afficherNòt();


});
// ===============================
// SISTÈM KÒMANN
// ===============================


function soveKommann(kommann){


    let kommannYo = JSON.parse(

        localStorage.getItem("kommann")

    ) || [];



    kommannYo.push(kommann);



    localStorage.setItem(

        "kommann",

        JSON.stringify(kommannYo)

    );


}







function voyeKommann(){



    let non = document.getElementById("nonClient").value;


    let phone = document.getElementById("phoneClient").value;


    let kantite = document.getElementById("kantite").value;





    if(non==="" || phone==="" || kantite===""){


        alert("Ranpli tout enfòmasyon yo ❌");


        return;

    }





    let kòmann = {


        pwodwi: produit.nom,


        pri: produit.prix,


        kantite: kantite,


        non: non,


        telefòn: phone,


        status:"An atant"


    };





    soveKommann(kòmann);





    let mesaj = `

🛍️ KAYLA MODE - NOUVO KÒMANN

👗 Pwodwi: ${produit.nom}

💰 Pri: ${produit.prix}

📦 Kantite: ${kantite}

👤 Non: ${non}

📞 Telefòn: ${phone}

📌 Status: An atant

`;





    let url =

    "https://wa.me/50955545291?text="

    +

    encodeURIComponent(mesaj);





    window.open(url,"_blank");



}    
</script>


</body>

</html>
