<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE - Detay pwodwi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">

<img 
src="images/logo.png"
class="logo"
alt="KAYLA MODE"
onerror="this.style.display='none'"
>


<h1>
👗 KAYLA MODE
</h1>


<p>
Detay pwodwi
</p>


</header>





<nav class="menu">


<a href="index.html">
🏠 Akèy
</a>


<a href="boutik.html">
🛍️ Boutik
</a>


<a href="cart.html">
🛒 Panier
</a>


<a href="contact.html">
📞 Kontak
</a>


</nav>







<section id="productDetail" class="products">


</section>







<footer>

<p>
© 2026 KAYLA MODE - Tout dwa rezève
</p>

</footer>






<script>


// ===============================
// CHARGE PWODWI
// ===============================


let produit = JSON.parse(

localStorage.getItem("produitChoisi")

);



const detail = document.getElementById(

"productDetail"

);





// ===============================
// SYSTEM AVIS
// ===============================


function kleAvis(){


    if(!produit){

        return "";

    }


    return "avis_"+produit.nom;


}





function jwennAvis(){


    let kle = kleAvis();



    return JSON.parse(

        localStorage.getItem(kle)

    ) || [];

}





function soveAvis(data){


    localStorage.setItem(

        kleAvis(),

        JSON.stringify(data)

    );


}






function zetwal(n){


    let star="";


    for(let i=0;i<n;i++){


        star+="⭐";


    }


    return star;


}
 
// ===============================
// AFFICHAGE PWODWI
// ===============================


if(produit){



detail.innerHTML = `



<div class="product">



<span class="tag">

${produit.tag || "Nouvo"}

</span>





<img 
src="${produit.image}" 
alt="${produit.nom}"
>





<h2>

${produit.nom}

</h2>





<p>

📂 ${produit.categorie || "Kategori"}

</p>





<p class="new-price">

${produit.prix}

</p>







<h3>

📦 Kantite

</h3>


<input 
type="number"
id="kantite"
value="1"
min="1"
>







<h3>

👤 Enfòmasyon kliyan

</h3>



<input 
id="nonClient"
placeholder="Non ou"
>



<input 
id="phoneClient"
placeholder="Nimewo WhatsApp ou"
>




<input 
id="adrèsClient"
placeholder="Adrès livrezon ou"
>







<h3>

💳 Mwayen peman

</h3>



<select id="mwayenPeman">


<option value="Cash">

💵 Peye lè livrezon

</option>


<option value="MonCash">

📱 MonCash

</option>


<option value="NatCash">

📱 NatCash

</option>


</select>







<button 
class="buy"
onclick="voyeKommann()"
>

🛒 Pase kòmann

</button>







<h3>

⭐ Bay pwodwi a yon nòt

</h3>




<select id="noteClient">


<option value="5">

⭐⭐⭐⭐⭐

</option>


<option value="4">

⭐⭐⭐⭐

</option>


<option value="3">

⭐⭐⭐

</option>


<option value="2">

⭐⭐

</option>


<option value="1">

⭐

</option>



</select>







<h3>

💬 Kòmantè ou

</h3>





<textarea 
id="mesajClient"
placeholder="Ekri opinyon ou..."
></textarea>






<button 
class="buy"
onclick="voyeAvis()"
>

📩 Voye kòmantè

</button>






<div id="listeAvis">

</div>





</div>



`;



}else{


detail.innerHTML = `

<h2>
Pa gen pwodwi chwazi
</h2>

`;



}







// ===============================
// VOYE AVIS
// ===============================


function voyeAvis(){


let non = document.getElementById("nonClient").value;


let mesaj = document.getElementById("mesajClient").value;


let note = Number(

document.getElementById("noteClient").value

);





if(non==="" || mesaj===""){


alert("Ranpli enfòmasyon yo ❌");

return;


}





let avis = jwennAvis();





avis.push({


non:non,


mesaj:mesaj,


note:note


});





soveAvis(avis);



alert("Mèsi pou opinyon ou ❤️");


location.reload();



    }

// ===============================
// AFFICHAGE AVIS
// ===============================


function mwayenNot(){


    let avis = jwennAvis();


    if(avis.length === 0){

        return 0;

    }



    let total = 0;



    avis.forEach(function(item){


        total += item.note;


    });




    return Math.round(total / avis.length);



}







function afficherAvis(){


    let box = document.getElementById(

        "listeAvis"

    );



    if(!box){

        return;

    }





    let avis = jwennAvis();



    let moy = mwayenNot();





    let html = `


    <h3>
    ⭐ Evalyasyon kliyan
    </h3>



    <p>

    Nòt mwayèn:

    ${moy > 0 ? zetwal(moy) : "Pa gen nòt ankò"}

    </p>



    <p>

    👥 ${avis.length} kliyan bay opinyon

    </p>


    `;







    avis.forEach(function(item){



        html += `


        <div class="comment-box">


        <h4>

        👤 ${item.non}

        </h4>



        <p>

        ${zetwal(item.note)}

        </p>



        <p>

        ${item.mesaj}

        </p>



        </div>



        `;



    });





    box.innerHTML = html;



}








// ===============================
// SISTÈM KÒMANN
// ===============================


function soveKommann(data){


    let kommann = JSON.parse(

        localStorage.getItem("kommann")

    ) || [];





    kommann.push(data);





    localStorage.setItem(

        "kommann",

        JSON.stringify(kommann)

    );



}








function voyeKommann(){


    let non = document.getElementById("nonClient").value;


    let phone = document.getElementById("phoneClient").value;


    let kantite = document.getElementById("kantite").value;


    let adresse = document.getElementById("adrèsClient").value;


    let peman = document.getElementById("mwayenPeman").value;






    if(non==="" || phone==="" || kantite===""){


        alert("Ranpli tout enfòmasyon yo ❌");


        return;

    }







    let kòmann = {



        pwodwi: produit.nom,


        pri: produit.prix,


        kantite:Number(kantite),


        non:non,


        telefòn:phone,


        adresse:adresse,


        peman:peman,


        status:"An atant"


    };







    soveKommann(kòmann);






    let mesaj = `

🛍️ KAYLA MODE - NOUVO KÒMANN


👗 Pwodwi: ${produit.nom}

💰 Pri: ${produit.prix}

📦 Kantite: ${kantite}

👤 Non: ${non}

📞 Telefòn: ${phone}

📍 Adrès: ${adresse}

💳 Peman: ${peman}

📌 Status: An atant

`;







    let url =

    "https://wa.me/50955545291?text="

    +

    encodeURIComponent(mesaj);







    window.open(url,"_blank");


}








// ===============================
// START
// ===============================


afficherAvis();



window.addEventListener(

"load",

function(){


    afficherAvis();


});



</script>


</body>

</html>
