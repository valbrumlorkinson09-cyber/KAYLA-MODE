<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE - Suivi Kòmann</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">


<img 
src="images/logo.png"
class="logo"
alt="KAYLA MODE"
onerror="this.style.display='none'"
>


<h1>
👗 KAYLA MODE
</h1>


<p>
Suivi kòmann ou
</p>


</header>





<nav class="menu">


<a href="index.html">
🏠 Akèy
</a>


<a href="boutik.html">
🛍️ Boutik
</a>


<a href="cart.html">
🛒 Panier
</a>


<a href="contact.html">
📞 Kontak
</a>


</nav>







<section class="products">


<h2>
📦 Chèche kòmann ou
</h2>



<input 
id="telephone"
placeholder="Antre nimewo telefòn ou"
>



<button class="buy" onclick="chacheKommann()">

🔍 Chèche

</button>






<div id="rezilta">

</div>



</section>







<footer>

<p>
© 2026 KAYLA MODE - Tout dwa rezève
</p>

</footer>








<script>


function chacheKommann(){



let tel = document.getElementById(

"telephone"

).value.trim();





let kommann = JSON.parse(

localStorage.getItem("kommann")

) || [];






let jwenn = kommann.filter(function(item){



return item.telephone == tel;



});







let box = document.getElementById(

"rezilta"

);





if(jwenn.length===0){



box.innerHTML = `


<div class="product">


<h3>

❌ Pa jwenn kòmann

</h3>


<p>

Verifye nimewo telefòn lan.

</p>


</div>


`;



return;


}






box.innerHTML="";






jwenn.forEach(function(item){



box.innerHTML += `


<div class="product">



<h3>

👗 ${item.pwodwi}

</h3>




<p>

💰 Pri: ${item.pri}

</p>




<p>

📦 Kantite: ${item.kantite}

</p>




<p>

📍 Adrès: ${item.adresse || "Pa bay"}

</p>




<p>

💳 Peman: ${item.peman || "Pa bay"}

</p>




<h3>

📌 Status: ${item.status}

</h3>



</div>



`;



});



}






</script>



</body>

</html>
