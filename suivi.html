<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAYLA MODE - Suivi Kòmann</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>👗 KAYLA MODE</h1>

<p>Suivi kòmann ou</p>

</header>



<section class="products">


<h2>📦 Chèche kòmann</h2>


<input id="telephone" placeholder="Antre nimewo telefòn ou">


<button class="buy" onclick="chacheKommann()">

🔍 Chèche

</button>



<div id="rezilta">

</div>



</section>




<script>


function chacheKommann(){


    let tel = document.getElementById("telephone").value;



    let kommann = JSON.parse(

        localStorage.getItem("kommann")

    ) || [];





    let jwenn = kommann.filter(function(item){


        return item.telefòn == tel;


    });






    let box = document.getElementById("rezilta");





    if(jwenn.length === 0){


        box.innerHTML = `

        <p>
        ❌ Pa jwenn kòmann.
        </p>

        `;


        return;


    }






    box.innerHTML = "";





    jwenn.forEach(function(item){



        box.innerHTML += `


        <div class="product">


        <h3>
        👗 ${item.pwodwi}
        </h3>



        <p>
        💰 ${item.pri}
        </p>



        <p>
        📦 Kantite: ${item.kantite}
        </p>




        <h3>

        📌 ${item.status}

        </h3>




        </div>


        `;


    });



}



</script>


</body>

</html>
