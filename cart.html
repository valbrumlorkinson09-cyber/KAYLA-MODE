<section class="products">


<h2>
🛍️ Pwodwi nan panier
</h2>




<div id="cartList">

</div>




<h2 id="cartTotal">

Total: 0 Gdes

</h2>







<button class="buy" onclick="voyePanierWhatsApp()">

📲 Voye kòmann WhatsApp

</button>





<button class="buy" onclick="viderPanier()">

🗑️ Vide panier

</button>




</section>







<footer>


<p>

© 2026 KAYLA MODE - Tout dwa rezève

</p>


</footer>









<script>


function jwennPanier(){


return JSON.parse(

localStorage.getItem("panier")

) || [];


}





function sovePanier(data){


localStorage.setItem(

"panier",

JSON.stringify(data)

);


}






function afficherPanier(){


let panier = jwennPanier();


let box = document.getElementById("cartList");


let total = 0;



box.innerHTML="";





if(panier.length===0){


box.innerHTML=

"<p>🛒 Panier la vid</p>";



document.getElementById("cartTotal").innerHTML=

"Total: 0 Gdes";


return;


}






panier.forEach(function(item,index){



let pri = Number(

String(item.prix)

.replace(/\D/g,'')

);



total += pri * item.kantite;





box.innerHTML += `



<div class="product">



<img src="${item.image}">



<h3>

${item.nom}

</h3>



<p class="new-price">

${item.prix}

</p>



<p>

📦 Kantite: ${item.kantite}

</p>





<button onclick="chanjeKantite(${index},1)">

➕

</button>



<button onclick="chanjeKantite(${index},-1)">

➖

</button>




<button onclick="efasePanier(${index})">

🗑️ Efase

</button>




</div>


`;



});





document.getElementById("cartTotal").innerHTML =

"Total: "+total+" Gdes";





afficherBadge();


}









function chanjeKantite(index,valeur){



let panier = jwennPanier();



panier[index].kantite += valeur;




if(panier[index].kantite <=0){


panier.splice(index,1);


}



sovePanier(panier);



afficherPanier();



}







function efasePanier(index){



let panier = jwennPanier();



panier.splice(index,1);



sovePanier(panier);



afficherPanier();



}








function viderPanier(){


localStorage.removeItem("panier");


afficherPanier();


alert("Panier vide 🛒");


}







function afficherBadge(){


let badge=document.getElementById("cartCount");



if(!badge){

return;

}



let kantite=0;



jwennPanier().forEach(function(item){


kantite += item.kantite;


});



badge.innerHTML=kantite;


}








function voyePanierWhatsApp(){


let panier=jwennPanier();



if(panier.length===0){


alert("Panier la vid ❌");


return;


}





let mesaj=

"🛒 KAYLA MODE - NOUVO KÒMAND\n\n";





panier.forEach(function(item){



mesaj +=

"👗 "+item.nom+

"\n📦 Kantite: "+item.kantite+

"\n💰 Pri: "+item.prix+

"\n\n";


});




mesaj +=

"🙏 Mèsi pou konfyans ou";





window.open(

"https://wa.me/50955545291?text="+

encodeURIComponent(mesaj),

"_blank"

);



}







afficherPanier();


</script>



</body>
