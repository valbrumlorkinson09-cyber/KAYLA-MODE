<section class="contact">


<h2>
🛒 Fè Kòmand
</h2>




<input 
id="nom"
type="text"
placeholder="Non ou"
>





<input 
id="telephone"
type="text"
placeholder="Nimewo WhatsApp ou"
>




<input 
id="adresse"
type="text"
placeholder="Adrès livrezon ou"
>






<select id="peman">


<option value="Cash">
💵 Peye lè livrezon
</option>


<option value="MonCash">
📱 MonCash
</option>


<option value="NatCash">
📱 NatCash
</option>


</select>







<textarea 
id="mesaj"
placeholder="Ekri pwodwi ou vle a">
</textarea>







<button class="buy" onclick="voyeKontak()">

📲 Voye Kòmand

</button>




</section>







<footer>

<p>

© 2026 KAYLA MODE - Tout dwa rezève

</p>

</footer>








<script>


function voyeKontak(){



let non=document.getElementById("nom").value;


let tel=document.getElementById("telephone").value;


let adr=document.getElementById("adresse").value;


let peman=document.getElementById("peman").value;


let mesaj=document.getElementById("mesaj").value;





if(non==="" || tel==="" || mesaj===""){


alert("Ranpli enfòmasyon yo ❌");

return;


}





let text=`

🛍️ KAYLA MODE - KÒMAND


👤 Non: ${non}

📞 Telefòn: ${tel}

📍 Adrès: ${adr}

💳 Peman: ${peman}


👗 Pwodwi:

${mesaj}


`;





window.open(

"https://wa.me/50955545291?text="+

encodeURIComponent(text),

"_blank"

);



}


</script>
