<section class="categories">


<h2>
🔥 Chwazi Kategori
</h2>



<div class="category-container">


<div class="box" onclick="filtreKategori('Fanm')">

👗 Fanm

</div>



<div class="box" onclick="filtreKategori('Gason')">

👔 Gason

</div>



<div class="box" onclick="filtreKategori('Soulye')">

👟 Soulye

</div>



<div class="box" onclick="filtreKategori('Sak')">

👜 Sak & Akseswa

</div>



</div>



</section>








<div id="productList" class="products">

</div>







<script>


function filtreKategori(kategori){



let produits = JSON.parse(

localStorage.getItem("produits")

) || [];




let box = document.getElementById(

"productList"

);



box.innerHTML="";





let rezilta = produits.filter(function(item){



return item.categorie == kategori;



});






if(rezilta.length===0){



box.innerHTML=

"<p>❌ Pa gen pwodwi nan kategori sa.</p>";

return;


}





rezilta.forEach(function(item){



box.innerHTML += `


<div class="product">


<img src="${item.image}">


<h3>

${item.nom}

</h3>


<p>

${item.prix}

</p>



</div>


`;



});



}



</script>
